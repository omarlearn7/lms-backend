<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاكاة التوازن الكيميائي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',Tahoma,sans-serif;display:flex;justify-content:center;padding:12px;min-height:100vh}
.container{max-width:700px;width:100%}
h1{text-align:center;font-size:16px;color:#fbbf24;margin-bottom:6px}
.equation{text-align:center;font-size:15px;color:#e2e8f0;background:#1e293b;padding:8px;border-radius:6px;margin-bottom:8px;border:1px solid #334155}
.equation .arrow{color:#22c55e;margin:0 8px}
.equation .coeff{font-size:11px;color:#94a3b8}
canvas#mainCanvas{background:#0f172a;border:1px solid #334155;border-radius:8px;display:block;margin:0 auto;width:100%;max-width:680px;height:300px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;background:#1e293b;border-radius:8px;padding:10px;border:1px solid #334155}
.ctrl-group{display:flex;flex-direction:column;gap:2px}
.ctrl-group label{font-size:11px;color:#94a3b8}
.ctrl-group .val{color:#fbbf24;font-size:12px;font-weight:700}
input[type=range]{width:100%;height:4px;-webkit-appearance:none;background:#334155;border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#f59e0b;cursor:pointer}
.dh-group{display:flex;gap:8px}
.dh-btn{flex:1;background:#334155;color:#94a3b8;border:1px solid #475569;border-radius:4px;padding:4px;font-size:11px;cursor:pointer;text-align:center;transition:all .15s}
.dh-btn.active{background:#f59e0b;color:#0f172a;border-color:#f59e0b;font-weight:700}
.data-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px;background:#1e293b;border-radius:8px;overflow:hidden;border:1px solid #334155}
.data-table th{background:#0f172a;color:#94a3b8;padding:6px 8px;font-weight:400;border-bottom:1px solid #334155}
.data-table td{padding:5px 8px;text-align:center;border-bottom:1px solid #0f172a}
.data-table td.val{color:#fbbf24;font-weight:700;direction:ltr}
.data-table tr:last-child td{border-bottom:none}
.info-row{display:flex;gap:12px;justify-content:center;margin-top:6px;font-size:12px;color:#94a3b8}
.info-row span{background:#1e293b;padding:4px 10px;border-radius:4px;border:1px solid #334155}
.info-row .k-val{color:#22c55e;font-weight:700}
.info-row .q-val{color:#f59e0b;font-weight:700}
.info-row .shift{font-weight:700}
.shift-right{color:#22c55e}
.shift-left{color:#ef4444}
.shift-none{color:#64748b}
.bar-label{font-size:10px;color:#94a3b8}
@media(max-width:500px){.controls{grid-template-columns:1fr}.info-row{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="container">
<h1>محاكاة تفاعلية: التوازن الكيميائي</h1>
<div class="equation" id="eqDisplay">A + B <span class="arrow">⇌</span> C + D</div>

<canvas id="mainCanvas" width="680" height="300"></canvas>

<div class="controls">
  <div class="ctrl-group">
    <label>تركيز A₀ الابتدائي: <span class="val" id="a0Val">1.00</span> mol/L</label>
    <input type="range" id="a0Slider" min="0.1" max="3.0" step="0.05" value="1.0">
  </div>
  <div class="ctrl-group">
    <label>تركيز B₀ الابتدائي: <span class="val" id="b0Val">1.00</span> mol/L</label>
    <input type="range" id="b0Slider" min="0.1" max="3.0" step="0.05" value="1.0">
  </div>
  <div class="ctrl-group">
    <label>درجة الحرارة: <span class="val" id="tempVal">25</span> °C</label>
    <input type="range" id="tempSlider" min="0" max="100" step="1" value="25">
    <div style="display:flex;justify-content:space-between;font-size:9px;color:#475569"><span>بارد</span><span>ساخن</span></div>
  </div>
  <div class="ctrl-group">
    <label>طبيعة التفاعل (ΔH):</label>
    <div class="dh-group">
      <button class="dh-btn active" data-dh="-1" id="dhExo">طاردة للحرارة <span style="color:#ef4444">↓</span></button>
      <button class="dh-btn" data-dh="1" id="dhEndo">ماصة للحرارة <span style="color:#f59e0b">↑</span></button>
    </div>
  </div>
</div>

<div class="info-row">
  <span>K = <span class="k-val" id="kDisplay">4.00</span></span>
  <span>Q = <span class="q-val" id="qDisplay">4.00</span></span>
  <span>الإزاحة: <span class="shift" id="shiftDisplay">عند التوازن</span></span>
  <span>x (التقدم) = <span id="xDisplay">0.500</span> mol/L</span>
</div>

<table class="data-table">
  <tr><th>الحالة</th><th>[A] (mol/L)</th><th>[B] (mol/L)</th><th>[C] (mol/L)</th><th>[D] (mol/L)</th></tr>
  <tr><td>ابتدائي</td><td class="val" id="initA">1.00</td><td class="val" id="initB">1.00</td><td class="val" id="initC">0.00</td><td class="val" id="initD">0.00</td></tr>
  <tr><td>عند التوازن</td><td class="val" id="eqA">0.50</td><td class="val" id="eqB">0.50</td><td class="val" id="eqC">0.50</td><td class="val" id="eqD">0.50</td></tr>
</table>
</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

const a0Slider = document.getElementById('a0Slider');
const b0Slider = document.getElementById('b0Slider');
const tempSlider = document.getElementById('tempSlider');
const dhBtns = document.querySelectorAll('.dh-btn');
const a0Val = document.getElementById('a0Val');
const b0Val = document.getElementById('b0Val');
const tempVal = document.getElementById('tempVal');

const initA = document.getElementById('initA');
const initB = document.getElementById('initB');
const initC = document.getElementById('initC');
const initD = document.getElementById('initD');
const eqA = document.getElementById('eqA');
const eqB = document.getElementById('eqB');
const eqC = document.getElementById('eqC');
const eqD = document.getElementById('eqD');
const kDisplay = document.getElementById('kDisplay');
const qDisplay = document.getElementById('qDisplay');
const shiftDisplay = document.getElementById('shiftDisplay');
const xDisplay = document.getElementById('xDisplay');

let dh = -1;
let animA = 0, animB = 0, animC = 0, animD = 0;
let targetA = 0, targetB = 0, targetC = 0, targetD = 0;
let prevA0 = 1, prevB0 = 1, prevTemp = 25;
let animating = false;

function getParams() {
  const A0 = parseFloat(a0Slider.value);
  const B0 = parseFloat(b0Slider.value);
  const T = parseFloat(tempSlider.value);
  return { A0, B0, T };
}

function computeK(T) {
  // K varies with temperature per van't Hoff
  // At 25°C, K = 4.0 for exothermic; K = 0.25 for endothermic
  const T0 = 25;
  const K0 = dh === -1 ? 4.0 : 0.25;
  const deltaH = dh === -1 ? -20000 : 20000; // J/mol
  const R = 8.314;
  const TK = T + 273.15;
  const TK0 = T0 + 273.15;
  return K0 * Math.exp(-deltaH / R * (1 / TK - 1 / TK0));
}

function computeEquilibrium(A0, B0, K) {
  if (A0 <= 0 || B0 <= 0) return { A: A0, B: B0, C: 0, D: 0, x: 0 };
  // Solve: K = x^2 / ((A0-x)(B0-x))
  // x^2 = K(A0-x)(B0-x)
  // x^2(1-K) + K(A0+B0)x - KA0B0 = 0
  let x;
  if (Math.abs(K - 1) < 1e-10) {
    x = (A0 * B0) / (A0 + B0);
  } else {
    const a = 1 - K;
    const b = K * (A0 + B0);
    const c = -K * A0 * B0;
    const disc = b * b - 4 * a * c;
    if (disc < 0) return { A: A0, B: B0, C: 0, D: 0, x: 0 };
    x = (-b + Math.sqrt(disc)) / (2 * a);
  }
  x = Math.max(0, Math.min(x, Math.min(A0, B0)));
  return { A: A0 - x, B: B0 - x, C: x, D: x, x };
}

function update() {
  const { A0, B0, T } = getParams();
  const K = computeK(T);
  const eq = computeEquilibrium(A0, B0, K);

  targetA = eq.A;
  targetB = eq.B;
  targetC = eq.C;
  targetD = eq.D;

  // Compute Q from current equilibrium state (after shift)
  const Q = eq.A > 0 && eq.B > 0 ? (eq.C * eq.D) / (eq.A * eq.B) : K;

  // Determine shift direction
  const Qratio = Q / K;
  let shiftText, shiftClass;
  if (Math.abs(Qratio - 1) < 0.01) {
    shiftText = '⚖ عند التوازن';
    shiftClass = 'shift-none';
  } else if (Qratio < 1) {
    shiftText = '← نحو النواتج (يمين)';
    shiftClass = 'shift-right';
  } else {
    shiftText = '→ نحو المتفاعلات (يسار)';
    shiftClass = 'shift-left';
  }

  kDisplay.textContent = K.toFixed(2);
  qDisplay.textContent = Q.toFixed(2);
  shiftDisplay.textContent = shiftText;
  shiftDisplay.className = 'shift ' + shiftClass;
  xDisplay.textContent = eq.x.toFixed(3);

  initA.textContent = A0.toFixed(2);
  initB.textContent = B0.toFixed(2);
  initC.textContent = '0.00';
  initD.textContent = '0.00';
  eqA.textContent = eq.A.toFixed(2);
  eqB.textContent = eq.B.toFixed(2);
  eqC.textContent = eq.C.toFixed(2);
  eqD.textContent = eq.D.toFixed(2);

  prevA0 = A0; prevB0 = B0; prevTemp = T;
  animating = true;
  draw();
  requestAnimationFrame(animate);
}

function lerp(a, b, t) { return a + (b - a) * t; }

function animate() {
  if (!animating) return;
  const speed = 0.08;
  animA = lerp(animA, targetA, speed);
  animB = lerp(animB, targetB, speed);
  animC = lerp(animC, targetC, speed);
  animD = lerp(animD, targetD, speed);

  const close = Math.abs(animA - targetA) < 0.001;
  if (close) { animA = targetA; animB = targetB; animC = targetC; animD = targetD; animating = false; }
  draw();
  if (animating) requestAnimationFrame(animate);
}

function draw() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  const padL = 60, padR = 60, padT = 30, padB = 30;
  const chartW = w - padL - padR;
  const chartH = h - padT - padB;
  const halfW = chartW / 2;

  const { A0, B0 } = getParams();
  const vals = [A0, B0, animA, animB, animC, animD];
  const maxVal = Math.max(Math.max(...vals), 0.5) * 1.15;

  // Draw background
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, w, h);

  // Title section labels
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';

  ctx.fillStyle = '#94a3b8';
  ctx.fillText('الابتدائي', padL + halfW / 2, 16);
  ctx.fillText('عند التوازن', padL + halfW + halfW / 2, 16);

  // Separator line
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(padL + halfW, padT);
  ctx.lineTo(padL + halfW, padT + chartH);
  ctx.stroke();
  ctx.setLineDash([]);

  // Draw bars: initial left, equilibrium right
  const barW = halfW / 5 - 6;
  const colors = { A: '#ef4444', B: '#f97316', C: '#22c55e', D: '#3b82f6' };

  function drawBar(x, value, color, label, yOff) {
    const barH = (value / maxVal) * chartH;
    const y = padT + chartH - barH;
    const grad = ctx.createLinearGradient(x, y, x, padT + chartH);
    grad.addColorStop(0, color);
    grad.addColorStop(1, color + '44');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(x, y, barW, barH, [3, 3, 0, 0]);
    ctx.fill();

    // Value label
    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(value.toFixed(2), x + barW / 2, y - 4);

    // Name label
    ctx.fillStyle = '#94a3b8';
    ctx.font = '10px sans-serif';
    ctx.fillText(label, x + barW / 2, padT + chartH + 14);
  }

  // Initial bars (left half)
  const xBaseL = padL + 4;
  const spacingL = (halfW - 8) / 2;
  drawBar(xBaseL + spacingL * 0, A0, colors.A, '[A]₀', 0);
  drawBar(xBaseL + spacingL * 1, B0, colors.B, '[B]₀', 0);

  // Equilibrium bars (right half)
  const xBaseR = padL + halfW + 4;
  const spacingR = (halfW - 8) / 4;
  drawBar(xBaseR + spacingR * 0, animA, colors.A, '[A]', 0);
  drawBar(xBaseR + spacingR * 1, animB, colors.B, '[B]', 0);
  drawBar(xBaseR + spacingR * 2, animC, colors.C, '[C]', 0);
  drawBar(xBaseR + spacingR * 3, animD, colors.D, '[D]', 0);

  // Y-axis label
  ctx.save();
  ctx.translate(14, padT + chartH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = '#64748b';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('التركيز (mol/L)', 0, 0);
  ctx.restore();

  // Y-axis grid
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = padT + chartH * (1 - i / 4);
    ctx.beginPath();
    ctx.moveTo(padL - 4, y);
    ctx.lineTo(padL + chartW, y);
    ctx.stroke();
    ctx.fillStyle = '#475569';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText((maxVal * i / 4).toFixed(1), padL - 8, y + 3);
  }

  // K value box
  ctx.fillStyle = '#1e293b';
  ctx.beginPath();
  ctx.roundRect(w - 90, 4, 86, 22, 4);
  ctx.fill();
  ctx.fillStyle = '#22c55e';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('K = ' + computeK(parseFloat(tempSlider.value)).toFixed(2), w - 84, 19);
}

// Polyfill roundRect
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
    const r = Array.isArray(radii) ? radii : [radii, radii, radii, radii];
    const [tl, tr, br, bl] = r.map(v => Math.min(v || 0, Math.min(w, h) / 2));
    this.moveTo(x + tl, y);
    this.lineTo(x + w - tr, y);
    this.quadraticCurveTo(x + w, y, x + w, y + tr);
    this.lineTo(x + w, y + h - br);
    this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
    this.lineTo(x + bl, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - bl);
    this.lineTo(x, y + tl);
    this.quadraticCurveTo(x, y, x + tl, y);
    this.closePath();
  };
}

a0Slider.addEventListener('input', () => {
  a0Val.textContent = parseFloat(a0Slider.value).toFixed(2);
  update();
});
b0Slider.addEventListener('input', () => {
  b0Val.textContent = parseFloat(b0Slider.value).toFixed(2);
  update();
});
tempSlider.addEventListener('input', () => {
  tempVal.textContent = tempSlider.value;
  update();
});
dhBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    dhBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    dh = parseInt(btn.dataset.dh);
    update();
  });
});

update();
animate();
</script>
</body>
</html>
