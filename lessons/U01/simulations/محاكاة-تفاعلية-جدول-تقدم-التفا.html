<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='UTF-8'><style>body{margin:0;padding:15px;font-family:'Segoe UI',Tahoma,Arial;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);color:#eaeaea;min-height:100vh}h3{text-align:center;color:#4fc3f7;margin:0 0 15px 0}.container{max-width:580px;margin:0 auto}.equation{background:#0f3460;padding:12px;border-radius:8px;text-align:center;font-size:18px;margin-bottom:15px;border:1px solid #4fc3f7}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}.control-group{background:#16213e;padding:10px;border-radius:8px}.control-group label{display:block;font-size:13px;margin-bottom:5px;color:#4fc3f7}.control-group input[type='range']{width:100%;accent-color:#4fc3f7}.value{font-weight:bold;color:#fff;font-size:16px}table{width:100%;border-collapse:collapse;background:#16213e;border-radius:8px;overflow:hidden}th{background:#0f3460;padding:10px;color:#4fc3f7;font-size:13px}td{padding:8px;text-align:center;border-top:1px solid #0f3460;font-size:13px}.limiting{background:#e94560 !important;color:#fff;font-weight:bold}.result{background:#0f3460;padding:12px;border-radius:8px;margin-top:15px;font-size:14px;line-height:1.8}.result strong{color:#4fc3f7}</style></head><body><div class='container'><h3>جدول تقدم التفاعل</h3><div class='equation'>2Fe(s) + 3Cl₂(g) → 2FeCl₃(s)</div><div class='controls'><div class='control-group'><label>كتلة الحديد m(Fe) = <span class='value' id='mFe'>11.2</span> g</label><input type='range' id='massFe' min='0' max='50' value='11.2' step='0.1'></div><div class='control-group'><label>حجم الكلور V(Cl₂) = <span class='value' id='vCl'>6.72</span> L</label><input type='range' id='volCl' min='0' max='30' value='6.72' step='0.1'></div></div><table><tr><th>الحالة</th><th>x (mol)</th><th>Fe</th><th>Cl₂</th><th>FeCl₃</th></tr><tr><td>ابتدائية</td><td>0</td><td id='nFe0'>-</td><td id='nCl0'>-</td><td>0</td></tr><tr><td>انتقالية</td><td>x</td><td>n₀-x</td><td>n₀-1.5x</td><td>x</td></tr><tr><td>نهائية</td><td id='xmaxCell'>-</td><td id='nFeF'>-</td><td id='nClF'>-</td><td id='nFeCl3'>-</td></tr></table><div class='result' id='result'></div></div><script>const MFe=56,Vm=22.4;const massFe=document.getElementById('massFe');const volCl=document.getElementById('volCl');function update(){const m=parseFloat(massFe.value);const v=parseFloat(volCl.value);document.getElementById('mFe').textContent=m.toFixed(1);document.getElementById('vCl').textContent=v.toFixed(1);const nFe0=m/MFe;const nCl0=v/Vm;document.getElementById('nFe0').textContent=nFe0.toFixed(3);document.getElementById('nCl0').textContent=nCl0.toFixed(3);const xmax1=nFe0;const xmax2=nCl0/1.5;const xmax=Math.min(xmax1,xmax2);document.getElementById('xmaxCell').textContent=xmax.toFixed(3);const nFeF=nFe0-xmax;const nClF=nCl0-1.5*xmax;const nFeCl3=xmax;document.getElementById('nFeF').textContent=nFeF.toFixed(3);document.getElementById('nFeCl').textContent=nFeCl3.toFixed(3);document.getElementById('nFeCl3').textContent=nFeCl3.toFixed(3);const rows=document.querySelectorAll('tr');rows.forEach(r=>r.querySelectorAll('td').forEach(c=>c.classList.remove('limiting')));const result=document.getElementById('result');let html='<strong>النتائج:</strong><br>';html+='• التقدم الأعظمي: x_max = '+xmax.toFixed(4)+' mol<br>';if(Math.abs(xmax1-xmax2)<0.001){html+='• <strong style="color:#4fc3f7">الوسط استوائي</strong> - استهلكت جميع المتفاعلات كلياً';}else if(xmax===xmax1){html+='• <strong style="color:#e94560">المتفاعل المحد: Fe</strong><br>';html+='• كمية Cl₂ المتبقية: '+nClF.toFixed(3)+' mol';}else{html+='• <strong style="color:#e94560">المتفاعل المحد: Cl₂</strong><br>';html+='• كمية Fe المتبقية: '+nFeF.toFixed(3)+' mol';}html+='<br>• كتلة FeCl₃ الناتجة: '+(nFeCl3*162.5).toFixed(2)+' g';result.innerHTML=html;}massFe.oninput=update;volCl.oninput=update;update();</script></body></html>
