<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='UTF-8'><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,Arial;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#eaeaea;min-height:100vh;padding:10px}h3{text-align:center;color:#00d2ff;margin-bottom:10px;font-size:15px}.container{max-width:580px;margin:0 auto}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.ctrl{background:rgba(255,255,255,0.08);padding:8px;border-radius:8px}.ctrl label{display:block;font-size:12px;color:#00d2ff;margin-bottom:4px}.ctrl input[type=range]{width:100%;accent-color:#ff6b6b}.val{font-weight:bold;color:#fff;font-size:14px}canvas{background:rgba(0,0,0,0.3);border-radius:8px;border:1px solid #00d2ff;width:100%;height:250px}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.stat{background:rgba(255,255,255,0.06);padding:6px;border-radius:6px;text-align:center;font-size:11px}.stat span{display:block;font-size:16px;font-weight:bold;color:#ff6b6b}</style></head><body><div class='container'><h3>تأثير العوامل الحركية على التصادمات</h3><div class='controls'><div class='ctrl'><label>درجة الحرارة: <span class='val' id='tempVal'>25</span>°C</label><input type='range' id='temp' min='5' max='80' value='25'></div><div class='ctrl'><label>التركيز: <span class='val' id='concVal'>10</span> جسيم</label><input type='range' id='conc' min='3' max='25' value='10'></div></div><canvas id='sim'></canvas><div class='stats'><div class='stat'>التصادمات الكلية<span id='totalC'>0</span></div><div class='stat'>التصادمات الفعالة<span id='effC' style='color:#4ecdc4'>0</span></div><div class='stat'>نسبة الفعالية<span id='ratio'>0%</span></div></div></div></body></html>
