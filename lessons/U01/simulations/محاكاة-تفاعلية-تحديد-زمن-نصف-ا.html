<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='UTF-8'><style>body{margin:0;padding:15px;font-family:'Segoe UI',Tahoma,Arial;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);color:#eaeaea;min-height:100vh}h3{text-align:center;color:#4fc3f7;margin:0 0 15px 0}.container{max-width:580px;margin:0 auto}.controls{background:#0f3460;padding:15px;border-radius:8px;margin-bottom:15px;display:flex;flex-direction:column;gap:10px}.control-group{display:flex;justify-content:space-between;align-items:center}label{color:#4fc3f7;font-size:14px}input[type='range']{width:60%;accent-color:#e94560}.value{font-weight:bold;color:#fff;font-size:16px}canvas{background:#16213e;border-radius:8px;border:1px solid #4fc3f7;width:100%;height:300px}.info{background:#0f3460;padding:12px;border-radius:8px;margin-top:15px;font-size:14px;line-height:1.8}.info strong{color:#e94560}</style></head><body><div class='container'><h3>تحديد زمن نصف التفاعل</h3><div class='controls'><div class='control-group'><label>سرعة التفاعل (عامل تحجيم):</label><input type='range' id='speed' min='1' max='10' value='5'><span class='value' id='speedVal'>5</span></div><div class='control-group'><label>التقدم الأعظمي xₘₐₓ (mmol):</label><input type='range' id='xmax' min='10' max='100' value='50'><span class='value' id='xmaxVal'>50</span></div></div><canvas id='graph'></canvas><div class='info' id='result'></div></div><script>const canvas=document.getElementById('graph'),ctx=canvas.getContext('2d');const speedInput=document.getElementById('speed'),xmaxInput=document.getElementById('xmax');const speedVal=document.getElementById('speedVal'),xmaxVal=document.getElementById('xmaxVal');let speed=5,xmax=50;function resize(){canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;draw()}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);const w=canvas.width,h=canvas.height;const pad=40;ctx.strokeStyle='#4fc3f7';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pad,10);ctx.lineTo(pad,h-pad);ctx.lineTo(w-10,h-pad);ctx.stroke();ctx.fillStyle='#eaeaea';ctx.font='12px Arial';ctx.fillText('x (mmol)',10,20);ctx.fillText('t (min)',w-40,h-10);const xMaxPx=h-pad-10;const tMaxPx=w-pad-10;ctx.strokeStyle='#e94560';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(pad,h-pad);for(let t=0;t<=100;t+=1){const x=xmax*(1-Math.exp(-speed*t/100));const px=pad+(t/100)*tMaxPx;const py=(h-pad)-(x/xmax)*xMaxPx;if(t===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.stroke();const halfX=xmax/2;const halfT=-Math.log(0.5)*100/speed;const pxHalf=pad+(halfT/100)*tMaxPx;const pyHalf=(h-pad)-(halfX/xmax)*xMaxPx;ctx.setLineDash([5,5]);ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad,pyHalf);ctx.lineTo(pxHalf,pyHalf);ctx.lineTo(pxHalf,h-pad);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.fillText(`x_max/2 = ${halfX}`,5,pyHalf+4);ctx.fillText(`t_1/2 = ${halfT.toFixed(1)} min`,pxHalf+5,h-pad-5);const res=document.getElementById('result');res.innerHTML=`<strong>النتائج:</strong><br>• التقدم الأعظمي: ${xmax} mmol<br>• عند t₁/₂، يكون التقدم: ${halfX} mmol<br>• <strong>زمن نصف التفاعل المستخرج من المنحنى: ${halfT.toFixed(1)} دقيقة</strong><br>• ملاحظة: كلما زادت سرعة التفاعل، قل زمن نصف التفاعل.`}speedInput.oninput=e=>{speed=+e.target.value;speedVal.textContent=speed;draw()};xmaxInput.oninput=e=>{xmax=+e.target.value;xmaxVal.textContent=xmax;draw()};window.onresize=resize;resize();</script></body></html>
